; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[env:xc]
platform = espressif32
board = esp32-s3-devkitc-1 
framework = arduino
monitor_speed = 115200
board_microros_transport=wifi
; 自定义 micro-ROS 配置：把 CUSTOM 传输 MTU 从默认 1024 提到 2048，
; 以发布 360 点 LaserScan (~1.5KB)。改后需重建 micro-ROS 库(删 libmicroros/ 目录)
board_microros_user_meta = custom.meta



;让单片机直接用原生 USB-CDC 模式（把 UART0 的 43/44 腾出来给雷达）
;注意：下载/串口监视器要插板子的"原生 USB"口（不是 CP2102 那个 UART 口）
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1



lib_deps = 
    https://gitee.com/ohhuo/micro_ros_platformio.git
    adafruit/Adafruit GFX Library @ ^1.10.16
    adafruit/Adafruit SSD1306 @ ^2.5.7
    madhephaestus/ESP32Servo@^0.13.0
    




