; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[env:xc]
platform = espressif32
board = esp32-s3-devkitc-1 
framework = arduino
monitor_speed = 115200
board_microros_transport=wifi
; 自定义 micro-ROS 配置：把 CUSTOM 传输 MTU 从默认 1024 提到 2048，
board_microros_user_meta = custom.meta

build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1



lib_deps = 
    https://gitee.com/ohhuo/micro_ros_platformio.git
    adafruit/Adafruit GFX Library @ ^1.10.16
    adafruit/Adafruit SSD1306 @ ^2.5.7
    madhephaestus/ESP32Servo@^0.13.0


; ────────────────────────────────────────────────────────────
;  OTA 无线升级（ArduinoOTA / espota，UDP 3232）
;  用法：pio run -e xc_ota -t upload
;  前提：小车已用【USB 线】烧录过带 OTA 功能的固件，且与电脑连同一 WiFi
; ────────────────────────────────────────────────────────────
[env:xc_ota]
extends = env:xc
upload_protocol = espota
; 小车 IP：以 OLED 上显示的为准（或改用 mDNS 名 x_roscar.local）
upload_port = 10.161.35.74
; 必须与 src/main.cpp 中的 OTA_PASSWORD 一致
upload_flags =
    --auth=xroscar_ota





